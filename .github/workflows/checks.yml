name: Exact evidence checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s src -p 'test_*.py'
      - run: python src/check_views.py
      - run: python src/exhaustive.py
      - run: python src/analyze.py
      - run: python src/analyze_controls.py
      - run: git diff --exit-code -- data results
